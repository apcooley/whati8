[pytest]
# pytest configuration for whati8
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    auth: Authentication tests
    api: API endpoint tests
    db: Database tests
    integration: Integration tests
    unit: Unit tests
    ai: AI service tests (may require API key)

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
