# Docker Compose reads variables from .env in the same directory automatically.
# Create .env from .env.example before running: cp .env.example .env

services:
  app:
    build: .
    ports:
      - "9428:9428"
    env_file: .env
    environment:
      - ENVIRONMENT=prod
      - DATABASE_URL=postgresql://whati8:${DB_PASSWORD:-whati8}@db:5432/whati8
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=whati8
      - POSTGRES_PASSWORD=${DB_PASSWORD:-whati8}
      - POSTGRES_DB=whati8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whati8"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  pgdata:
