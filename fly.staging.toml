app = "whati8-staging"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "staging"
  LOG_LEVEL = "info"
  ALLOWED_ORIGINS = '["https://whati8-staging.fly.dev", "http://localhost:5173"]'
  REGISTRATION_ENABLED = "true"
  DB_POOL_SIZE = "5"
  DB_MAX_OVERFLOW = "2"
  DB_POOL_RECYCLE = "300"

[http_service]
  internal_port = 9428
  force_https = true
  auto_stop = "suspend"
  auto_start = true

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
